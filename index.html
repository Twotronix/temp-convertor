<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celcius To Farenheight Convertor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="frameMain">
        <h1 id="title">Temperature Converter</h1>
        <div class="dropdowns">
            <select id="dropdown1">
                <option value="c" id="cel">°C</option>
                <option value="f" id="far">°F</option>
                <option value="k" id="kel">°K</option>
                <option value="r" id="ran">°R</option>
            </select>
            <h3>To</h3>
            <select id="dropdown2">
                <option value="f">°F</option>
                <option value="c">°C</option>
                <option value="k">°K</option>
                <option value="r">°R</option>
                
            </select>
        </div>
        <input placeholder="Enter Temperature" id="inputField">
        <button id="convertBtn">Convert</button>
        <h2 id="preview"></h2>
    </div>
    <script src="app.js"></script>
    <script src="theme.js"></script>
</body>
</html>
